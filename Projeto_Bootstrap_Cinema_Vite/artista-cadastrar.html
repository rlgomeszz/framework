<main class="container py-4">

<div class="page-header mb-4">
  <span class="badge text-bg-primary mb-2"><i class="bi-person-video2 me-1"></i> Cadastro</span>
  <h1 class="h2">Cadastrar Artista</h1>
  <p class="text-secondary mb-0">Preencha os dados abaixo para registrar uma nova informação.</p>
</div>
<form class="demo-form">
  <div class="row g-3"><div class="col-md-6"><label class="form-label" for="nome-completo">Nome completo</label><input type="text" class="form-control" id="nome-completo" required></div><div class="col-md-6"><label class="form-label" for="data-de-nascimento">Data de nascimento</label><input type="date" class="form-control" id="data-de-nascimento" required></div><div class="col-md-6"><label class="form-label" for="nacionalidade">Nacionalidade</label><input type="text" class="form-control" id="nacionalidade" required></div><div class="col-md-6"><label class="form-label" for="profissao">Profissão</label><input type="text" class="form-control" id="profissao" required></div><div class="col-12"><label class="form-label" for="biografia">Biografia</label><textarea class="form-control" id="biografia" rows="4" required></textarea></div></div>
  <div class="form-check mt-4">
    <input class="form-check-input" type="checkbox" id="confirm" required>
    <label class="form-check-label" for="confirm">Confirmo que os dados informados estão corretos.</label>
  </div>
  <div class="alert alert-success form-feedback d-none mt-4" role="alert"></div>
  <div class="d-flex gap-2 mt-4">
    <a href="artista-listar.html" class="btn btn-outline-secondary">Voltar</a>
    <a href="#" class="btn btn-primary" onclick="this.closest('form').requestSubmit(); return false;">Salvar cadastro</a>
  </div>
</form>

</main>
